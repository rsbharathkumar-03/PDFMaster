# Spring Boot Application Properties
spring.application.name=pdfmaster-backend
server.port=8080

# Multipart Upload Configuration (25MB Limit)
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB

# Database Configuration (Defaults to in-memory H2 if MySQL not configured)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:pdfmaster;DB_CLOSE_DELAY=-1}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging Configuration
logging.level.root=INFO
logging.level.com.pdfmaster=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Contact Form & Notifications Routing
app.contact.recipient-email=rsbharathk@gmail.com
app.contact.mail.enabled=true
app.contact.mail.subject-prefix=[PDFMaster Inquiries]

